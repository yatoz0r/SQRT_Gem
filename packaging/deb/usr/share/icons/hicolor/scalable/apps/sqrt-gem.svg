<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E" />
      <stop offset="100%" stop-color="#0F0F17" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38EF7D" />
      <stop offset="100%" stop-color="#11998E" />
    </linearGradient>
    <linearGradient id="radGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded plate -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgGrad)" stroke="#2D3748" stroke-width="4" />

  <!-- Radical Sign (SQRT) -->
  <path d="M 46 148 L 68 148 L 92 208 L 132 72 L 216 72" 
        fill="none" 
        stroke="url(#radGrad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Precision Gem Polygon under radical -->
  <polygon points="172,108 204,136 172,192 140,136" 
           fill="url(#gemGrad)" 
           stroke="#E2E8F0" 
           stroke-width="2" 
           opacity="0.95" />

  <!-- Gem Facet Highlights -->
  <line x1="172" y1="108" x2="172" y2="192" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />
  <line x1="140" y1="136" x2="204" y2="136" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />
</svg>
