name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test & Coverage (Matrix)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest with Coverage
        run: |
          python -m pytest

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  build:
    name: Build Installers & Binaries
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # Windows: Build Executable & MSI Installer
      - name: Build Windows Executable & MSI
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name "SQRT_Gem" --add-data "locales;locales" src/main.py
          .\packaging\build_msi.ps1

      # Linux: Build Executable & Debian Package (.deb)
      - name: Build Linux Executable & Debian Package
        if: runner.os == 'Linux'
        run: |
          python3 -m PyInstaller --noconfirm --onedir --windowed --name "SQRT_Gem" --add-data "locales:locales" src/main.py
          python3 packaging/build_deb.py

      # Upload Raw Binaries
      - name: Upload Release Artifacts (Binaries)
        uses: actions/upload-artifact@v4
        with:
          name: SQRT_Gem-${{ runner.os }}-binaries
          path: dist/SQRT_Gem/

      # Upload Native Installers (MSI / DEB)
      - name: Upload Native Installers
        uses: actions/upload-artifact@v4
        with:
          name: SQRT_Gem-${{ runner.os }}-installer
          path: dist_installer/
