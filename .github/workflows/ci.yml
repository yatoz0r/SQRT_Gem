name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test & Coverage (Matrix)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libfontconfig1 \
            libgl1-mesa-dri \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Pytest with Coverage (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python -m pytest -v --tb=short 2>&1 | tee pytest_output.log

      - name: Publish Test Summary (Linux)
        if: always() && runner.os == 'Linux'
        run: |
          if [ -f pytest_output.log ]; then
            echo '### Pytest Execution Summary' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 pytest_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Run Pytest with Coverage (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pytest -v --tb=short

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            .coverage*
            coverage.xml
          if-no-files-found: warn


  build:
    name: Build Installers & Binaries
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libfontconfig1 \
            libgl1-mesa-dri \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            xvfb

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        run: |
          python -c "import urllib.request, zipfile, os; url = 'https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip'; zip_path = os.path.join(os.environ['TEMP'], 'wix311.zip'); dest = r'C:\wix'; urllib.request.urlretrieve(url, zip_path); zipfile.ZipFile(zip_path).extractall(dest)"
          echo "C:\wix" >> $env:GITHUB_PATH




      # Windows: Build Executable & MSI Installer
      - name: Build Windows Executable & MSI
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name "SQRT_Gem" --add-data "locales;locales" src/main.py
          .\packaging\build_msi.ps1

      # Linux: Build Executable & Debian Package (.deb)
      - name: Build Linux Executable & Debian Package
        if: runner.os == 'Linux'
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name "SQRT_Gem" --add-data "locales:locales" src/main.py
          python packaging/build_deb.py

      # Upload Raw Binaries
      - name: Upload Release Artifacts (Binaries)
        uses: actions/upload-artifact@v4
        with:
          name: SQRT_Gem-${{ runner.os }}-binaries
          path: dist/SQRT_Gem/
          if-no-files-found: error

      # Upload Native Installers (MSI / DEB)
      - name: Upload Native Installers
        uses: actions/upload-artifact@v4
        with:
          name: SQRT_Gem-${{ runner.os }}-installer
          path: dist_installer/
          if-no-files-found: error
